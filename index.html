<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>JAI MATA DI SELLING</title><link rel="manifest" href="manifest.json"><style>:root{--g:#2e7d32}*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#f7f7f7}header{background:var(--g);color:#fff;padding:12px;position:sticky;top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}.card{background:#fff;border-radius:12px;padding:8px;box-shadow:0 2px 6px rgba(0,0,0,.1)}.card img{width:100%;height:120px;object-fit:cover;border-radius:8px}.dot{width:22px;height:22px;border-radius:50%;border:2px solid #ddd;display:inline-block;margin:2px}.dot.sel{border:2px solid #000;transform:scale(1.2)}.bill{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid var(--g);padding:10px;max-height:55vh;overflow:auto}.btn{background:var(--g);color:#fff;border:none;padding:10px;border-radius:8px;width:100%;margin-top:6px}</style></head><body>
<header><div style="display:flex;justify-content:space-between"><b>JAI MATA DI NURSERY</b><div><button onclick="setLang('en')" id="btn-en">EN</button><button onclick="setLang('hi')" id="btn-hi">हिं</button><button onclick="setLang('mr')" id="btn-mr">मरा</button></div></div><input id="searchInput" style="width:100%;padding:10px;border-radius:8px;border:none;margin-top:8px" placeholder="Search plant..." oninput="render()"></header>
<div id="grid" class="grid"></div>
<div class="bill"><div id="billItems">Empty</div><div style="display:flex;gap:6px"><input id="disc" type="number" placeholder="Discount" style="flex:1;padding:8px"><select id="gst" style="flex:1;padding:8px"><option value="0">GST OFF</option><option value="18" selected>GST 18%</option></select></div><div id="total" style="font-weight:800">Total: ₹0</div><canvas id="qr"></canvas><br><button class="btn" onclick="genBill()">Generate QR + Save (Offline OK)</button><small id="sync"></small></div>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script>
let PRODUCTS=JSON.parse(localStorage.getItem('products')||'[]'); let lang='en'; let cart=[]; let UPI=localStorage.getItem('upi')||'jaimatadi@okhdfcbank';
function setLang(l){lang=l;render();}
function render(){let q=document.getElementById('searchInput').value.toLowerCase();let g=document.getElementById('grid');g.innerHTML='';PRODUCTS.filter(p=>(p.name[lang]||p.name.en).toLowerCase().includes(q)).forEach(p=>{let s=p._sel||0;let v=p.variants[s];let d=document.createElement('div');d.className='card';d.innerHTML=`<img src="${v.photo}"><br><b>${p.name[lang]||p.name.en}</b><br><small>${p.inch?`${p.inch} Inch | ${p.company} | ${p.type}`:''}</small><div>${p.variants.map((vv,i)=>`<div class="dot ${i==s?'sel':''}" style="background:${vv.colorCode}" onclick="selVar(${p.id},${i})"></div>`).join('')}</div><small>${v.color} | St:${v.stock} | ₹${v.price}</small><button class="btn" onclick="addBill(${p.id})">Add +</button>`;g.appendChild(d);});}
window.selVar=(id,i)=>{let p=PRODUCTS.find(x=>x.id==id);p._sel=i;render();}
window.addBill=(id)=>{let p=PRODUCTS.find(x=>x.id==id);let v=p.variants[p._sel||0];cart.push({name:p.name[lang]||p.name.en,color:v.color,price:v.price});v.stock--;localStorage.setItem('products',JSON.stringify(PRODUCTS));upd();render();}
function upd(){let sub=cart.reduce((s,c)=>s+c.price,0);let disc=parseFloat(document.getElementById('disc').value||0);let gst=parseFloat(document.getElementById('gst').value||0);let tot=(sub-disc)*(1+gst/100);document.getElementById('total').innerText=`Total: ₹${tot.toFixed(0)}`;document.getElementById('billItems').innerHTML=cart.map((c,i)=>`${i+1}. ${c.name} (${c.color}) ₹${c.price}`).join('<br>')||'Empty';return tot;}
window.genBill=()=>{let tot=upd();let link=`upi://pay?pa=${UPI}&pn=JAI MATA DI NURSERY&am=${tot.toFixed(0)}&cu=INR`;QRCode.toCanvas(document.getElementById('qr'),link,{width:160});let bills=JSON.parse(localStorage.getItem('bills')||'[]');bills.push({id:Date.now(),cart,total:tot});localStorage.setItem('bills',JSON.stringify(bills));document.getElementById('sync').innerText='Saved Offline ✅';}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js'); render();
</script></body></html>
