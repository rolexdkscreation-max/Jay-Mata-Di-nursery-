<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>JAI MATA DI SELLING</title><link rel="manifest" href="manifest.json"><style>:root{--g:#2e7d32}*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#f7f7f7;padding-bottom:280px}header{background:var(--g);color:#fff;padding:12px;position:sticky;top:0;z-index:10}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}.card{background:#fff;border-radius:12px;padding:8px;box-shadow:0 2px 6px rgba(0,0,0,.1)}.card img{width:100%;height:120px;object-fit:cover;border-radius:8px}.dot{width:22px;height:22px;border-radius:50%;border:2px solid #ddd;display:inline-block;margin:2px;cursor:pointer}.dot.sel{border:2px solid #000;transform:scale(1.2)}.bill{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:3px solid var(--g);padding:10px;max-height:60vh;overflow:auto}.btn{background:var(--g);color:#fff;border:none;padding:12px;border-radius:8px;width:100%;margin-top:6px;font-weight:700}#qrBox{text-align:center;margin:10px 0;display:none;background:#fff;padding:10px;border:2px dashed var(--g);border-radius:10px}</style></head><body>
<header><div style="display:flex;justify-content:space-between"><b>JAI MATA DI NURSERY</b><div><button onclick="setLang('en')">EN</button><button onclick="setLang('hi')">हिं</button><button onclick="setLang('mr')">मरा</button></div></div><input id="searchInput" style="width:100%;padding:10px;border-radius:8px;border:none;margin-top:8px" placeholder="Search plant..." oninput="render()"></header>
<div id="grid" class="grid"></div>
<div class="bill">
<div id="billItems">Empty - Koi item add nahi kiya</div>
<div style="display:flex;gap:6px;margin:8px 0"><input id="disc" type="number" placeholder="Discount ₹" style="flex:1;padding:8px;border-radius:6px;border:1px solid #ccc"><select id="gst" style="flex:1;padding:8px"><option value="0">GST OFF</option><option value="18" selected>GST 18%</option></select></div>
<div id="total" style="font-weight:800;font-size:18px">Total: ₹0</div>
<div id="qrBox"><p style="margin:0;font-weight:700">📲 Customer Is QR Se Pay Karega</p><canvas id="qrCanvas"></canvas><p id="upiShow" style="font-size:12px"></p><img id="qrImg" style="display:none"></div>
<button class="btn" onclick="genBill()" style="background:#1b5e20;font-size:16px">💰 Generate QR + Bill Save Karo</button>
<small id="sync" style="color:green;font-weight:700"></small>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script>
let PRODUCTS=JSON.parse(localStorage.getItem('products')||'[]'); let lang='en'; let cart=[];
function getUPI(){return localStorage.getItem('upi')||'7050279271@kotak';}
function setLang(l){lang=l;render();}
function render(){let q=document.getElementById('searchInput').value.toLowerCase();let g=document.getElementById('grid');g.innerHTML='';PRODUCTS.filter(p=>(p.name[lang]||p.name.en).toLowerCase().includes(q)).forEach(p=>{let s=p._sel||0;let v=p.variants[s];let d=document.createElement('div');d.className='card';d.innerHTML=`<img src="${v.photo}" onerror="this.src='https://via.placeholder.com/300'"><br><b>${p.name[lang]||p.name.en}</b><br><small>${p.category||''}</small><div>${p.variants.map((vv,i)=>`<div class="dot ${i==s?'sel':''}" style="background:${vv.colorCode}" onclick="selVar(${p.id},${i})" title="${vv.color}"></div>`).join('')}</div><small>${v.color} | St:${v.stock} | ₹${v.price}</small><button class="btn" onclick="addBill(${p.id})">Add +</button>`;g.appendChild(d);});}
window.selVar=(id,i)=>{let p=PRODUCTS.find(x=>x.id==id);p._sel=i;render();}
window.addBill=(id)=>{let p=PRODUCTS.find(x=>x.id==id);let v=p.variants[p._sel||0];if(v.stock<=0)return alert('Stock khatam!');cart.push({id:p.id,varIdx:p._sel||0,name:p.name[lang]||p.name.en,color:v.color,price:v.price});v.stock--;localStorage.setItem('products',JSON.stringify(PRODUCTS
